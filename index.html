<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>26CC Bondly</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!--
    GitHub Pages often publishes the repo root. That must NOT load /src/main.js
    (that URL is site-root-relative and 404s on github.io).
    The built app lives under ./docs/ — redirect there.
    Local dev: Vite serves spa.html for / (see vite.config.js).
  -->
  <script>
    (function () {
      var q = location.search || ''
      var h = location.hash || ''
      location.replace('./docs/' + q + h)
    })()
  </script>
</head>
<body>
  <p style="font-family: system-ui, sans-serif; margin: 2rem">
    <a href="./docs/">Open 26CC Bondly</a>
  </p>
</body>
</html>
