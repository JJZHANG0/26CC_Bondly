    const lang = ref(localStorage.getItem('al-lang') || 'en');
    const dark = ref(false);
    const page = ref('home');
    const showLogin = ref(false);
    const showSignup = ref(false);
    const navScrolled = ref(false);
    const mobileOpen = ref(false);
    const isYearly = ref(false);
    const betaEmail = ref('');
    const betaJoined = ref(false);
    const pageTransitioning = ref(false);

    const t = computed(() => i18n[lang.value]);

    /* Init theme */
    onMounted(() => {
      const savedDark = localStorage.getItem('al-dark');
      if (savedDark === '1') { dark.value = true; applyTheme(true); }
      // Scroll listener
      window.addEventListener('scroll', onScroll, { passive: true });
      // Cursor
      window.addEventListener('mousemove', onMouse);
      // Initial reveal
      setTimeout(doReveal, 100);
    });
    onUnmounted(() => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('mousemove', onMouse);
    });

    function applyTheme(d) {
      if (d) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }
    function toggleDark() {
      dark.value = !dark.value;
      applyTheme(dark.value);
      localStorage.setItem('al-dark', dark.value ? '1' : '0');
    }
    function toggleLang() {
      lang.value = lang.value === 'en' ? 'zh' : 'en';
      localStorage.setItem('al-lang', lang.value);
    }
    function onScroll() { navScrolled.value = window.scrollY > 24; }
    function onMouse(e) {
      const el = document.getElementById('cursor-glow');
      if (el) { el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; }
    }

    function navigate(p) {
      if (p === page.value) { mobileOpen.value = false; return; }
      pageTransitioning.value = true;
      setTimeout(() => {
        page.value = p;
        mobileOpen.value = false;
        pageTransitioning.value = false;
        window.scrollTo({ top: 0, behavior: 'instant' });
        setTimeout(doReveal, 80);
      }, 280);
    }

    function doReveal() {
      const els = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      els.forEach(el => { el.classList.remove('visible'); observer.observe(el); });
    }

    function joinBeta() {
      if (betaEmail.value) { betaJoined.value = true; betaEmail.value = ''; }
    }

    const replayMsgs = [
      { ai: true,  t: 'Tell me what happened. Walk me through it from when you first noticed something felt off.' },

      { ai: true,  t: 'That pattern — sharing something meaningful and getting a neutral deflection — is something we have seen before in your history.' },
    ];

    const chatMsgs = [
      { t: 'Hey, I just wanted to double-check — did you see my message?', s: false },
      { t: 'Oh yeah, I meant to respond. Anyway, did you finish the report?', s: false },
      { t: 'Yeah, I finished it... I also had questions but I guess it is fine.', s: true },
    ];

    const replayEvents = [
      { time: '14:02', text: 'You entered the meeting. Energy level: 72%.', active: false, ins: null },
      { time: '14:08', text: '"I do not think that is a priority." — Colleague.', active: true, ins: 'Possible minimizing language detected' },
      { time: '14:15', text: 'You stopped contributing. Skin response elevated.', active: false, ins: null },
      { time: '14:28', text: 'Meeting ended. Energy level: 44%.', active: false, ins: null },
    ];

    return {
      lang, dark, page, showLogin, showSignup, navScrolled, mobileOpen,
      isYearly, betaEmail, betaJoined, pageTransitioning, t,
      toggleDark, toggleLang, navigate, joinBeta,
      replayMsgs, chatMsgs, replayEvents,
